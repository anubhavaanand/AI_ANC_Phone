name: Bug Report
description: Report a bug in AI_ANC_Phone
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen and what actually happened.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model + Android version
      description: e.g. Pixel 7 / Android 14
      placeholder: "e.g. Pixel 7 / Android 14"
    validations:
      required: true
  - type: input
    id: earbuds
    attributes:
      label: Earbuds model
      description: Optional — the earbuds you were using.
      placeholder: "e.g. Pixel Buds Pro"
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: App version or commit
      description: The app version or git commit you were running.
    validations:
      required: true
  - type: textarea
    id: logcat
    attributes:
      label: adb logcat output
      description: Optional logcat output. Renders as a code block.
      render: shell
    validations:
      required: false